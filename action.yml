name: 'WOMBATpass Scan'
description: 'Run a WOMBATpass IaC compliance scan and push the result to a Wombat server.'
author: 'WAF2p'
branding:
  icon: shield
  color: blue

inputs:
  server_url:
    description: 'Base URL of the Wombat server. The action posts to /api/v1/runs (e.g. https://wombat.example.com).'
    required: true
  api_token:
    description: 'Bearer token for the Wombat server. Use secrets.WOMBAT_TOKEN.'
    required: false
  api_key:
    description: 'API key for server ingestion. Use secrets.WOMBAT_API_KEY. Either api_token or api_key is required.'
    required: false
  scan_path:
    description: 'Path(s) to scan. Separate multiple paths with spaces (e.g. "./aws ./azure").'
    required: true
    default: '.'
  iac_framework:
    description: 'IaC framework plugin to use: terraform, bicep, cdk, pulumi.'
    required: false
    default: 'terraform'
  stage:
    description: 'Deployment stage this run targets, e.g. dev, staging, prod.'
    required: false
  project:
    description: 'Project / repo name. Defaults to github.repository.'
    required: false
  branch:
    description: 'Git branch. Defaults to github.ref_name.'
    required: false
  git_sha:
    description: 'Commit SHA. Defaults to github.sha.'
    required: false
  fail_on:
    description: >
      Fail the workflow step if the scan contains: fail (any FAIL),
      skip (any FAIL or SKIP), any (same as skip), high/medium/critical
      (a finding of at least that severity), or never.
    required: false
    default: 'fail'
  min_severity:
    description: 'Minimum severity to evaluate: low, medium, high, critical.'
    required: false
  controls_dir:
    description: 'Path to local Wombat YAML controls directory.'
    required: false
  server_controls:
    description: 'Fetch controls from the Wombat server instead of using controls_dir.'
    required: false
    default: 'false'
  fetch_controls:
    description: 'Clone the Wombat controls from the framework repo before scanning. Use when the controls are not already available locally.'
    required: false
    default: 'false'
  framework_repo:
    description: 'GitHub repo (owner/name) to fetch controls from when fetch_controls is enabled.'
    required: false
    default: 'WAF2p/framework'
  verbose:
    description: 'Show all results including PASSes.'
    required: false
    default: 'false'
  plan_file:
    description: 'Path to a Terraform plan JSON file for change overview analysis.'
    required: false
  upload_source:
    description: 'Upload source file contents so the dashboard can render diff previews.'
    required: false
    default: 'false'
  wombat_version:
    description: 'Version of wombat-core to install (e.g. 1.0.0). Leave empty for latest.'
    required: false
  wombat_source:
    description: 'Override pip install source, e.g. git+https://github.com/WAF2p/pass.git. Takes precedence over wombat_version.'
    required: false
  wafpass_version:
    description: 'Deprecated alias for wombat_version. Use wombat_version instead.'
    required: false
  wafpass_source:
    description: 'Deprecated alias for wombat_source. Use wombat_source instead.'
    required: false
  python_version:
    description: 'Python version to set up for the runner.'
    required: false
    default: '3.12'

outputs:
  run_id:
    description: 'ID of the run created on the Wombat server.'
    value: ${{ steps.run.outputs.run_id }}
  score:
    description: 'Overall compliance score returned by the server.'
    value: ${{ steps.run.outputs.score }}
  findings_count:
    description: 'Number of findings in the scan result.'
    value: ${{ steps.run.outputs.findings_count }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    - name: Fetch Wombat controls
      id: fetch-controls
      if: ${{ inputs.fetch_controls == 'true' }}
      shell: bash
      run: |
        src="${RUNNER_TEMP}/wombat-framework"
        dest="${RUNNER_TEMP}/wombat-controls"
        rm -rf "$src" "$dest"
        git clone --depth 1 "https://github.com/${{ inputs.framework_repo }}.git" "$src"
        mkdir -p "$dest"
        cp "$src"/modules/controls/controls/*.yml "$dest"/
        echo "dir=$dest" >> "$GITHUB_OUTPUT"
        echo "Fetched $(ls "$dest" | wc -l) control file(s) from ${{ inputs.framework_repo }}"

    - id: run
      run: python3 "${{ github.action_path }}/run.py"
      shell: bash
      env:
        WOMBAT_PUSH_URL: ${{ inputs.server_url }}
        WOMBAT_API_TOKEN: ${{ inputs.api_token }}
        WOMBAT_API_KEY: ${{ inputs.api_key }}
        WOMBAT_SCAN_PATH: ${{ inputs.scan_path }}
        WOMBAT_IAC: ${{ inputs.iac_framework }}
        WOMBAT_STAGE: ${{ inputs.stage }}
        WOMBAT_PROJECT: ${{ inputs.project }}
        WOMBAT_BRANCH: ${{ inputs.branch }}
        WOMBAT_GIT_SHA: ${{ inputs.git_sha }}
        WOMBAT_FAIL_ON: ${{ inputs.fail_on }}
        WOMBAT_MIN_SEVERITY: ${{ inputs.min_severity }}
        WOMBAT_CONTROLS_DIR: ${{ inputs.controls_dir || steps.fetch-controls.outputs.dir }}
        WOMBAT_SERVER_CONTROLS: ${{ inputs.server_controls }}
        WOMBAT_VERBOSE: ${{ inputs.verbose }}
        WOMBAT_PLAN_FILE: ${{ inputs.plan_file }}
        WOMBAT_UPLOAD_SOURCE: ${{ inputs.upload_source }}
        WOMBAT_VERSION: ${{ inputs.wombat_version || inputs.wafpass_version }}
        WOMBAT_SOURCE: ${{ inputs.wombat_source || inputs.wafpass_source }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_SHA: ${{ github.sha }}